<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Catalogue — PRESTIGE AUTO</title>
  <meta name="description" content="Catalogue de véhicules premium PRESTIGE AUTO (site de démonstration, véhicules fictifs).">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <noscript><style>body{opacity:1}.reveal,.rise{opacity:1;transform:none}</style></noscript>
</head>
<body data-page="catalogue">
  <header id="site-header" class="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow rise">Catalogue</p>
        <h1 class="rise d1">Trouvez <em>votre</em> prochaine voiture</h1>
        <p class="rise d2">12 véhicules premium sélectionnés, expertisés et garantis. Affinez votre recherche par marque, budget, kilométrage ou énergie. <span class="demo-flag">Véhicules fictifs</span></p>
      </div>
    </section>

    <section class="section" style="padding-top:50px">
      <div class="container catalogue-layout">
        <div class="filters-backdrop" id="filters-backdrop"></div>
        <aside class="filters" id="filters" aria-label="Filtres">
          <form id="filter-form" onsubmit="return false">
            <div class="filters-head">
              <h2>Filtres</h2>
              <button type="button" class="link-btn" id="reset">Réinitialiser</button>
            </div>

            <div class="filter-group">
              <label for="f-brand">Marque</label>
              <select class="select" id="f-brand" name="brand">
                <option value="">Toutes les marques</option>
              </select>
            </div>

            <div class="filter-group">
              <label for="f-price">Prix maximum <output id="o-price" for="f-price"></output></label>
              <input type="range" id="f-price" name="price" step="5000">
              <div class="range-scale"><span id="s-price-min"></span><span id="s-price-max"></span></div>
            </div>

            <div class="filter-group">
              <label for="f-km">Kilométrage maximum <output id="o-km" for="f-km"></output></label>
              <input type="range" id="f-km" name="km" step="5000">
              <div class="range-scale"><span>0 km</span><span id="s-km-max"></span></div>
            </div>

            <fieldset class="filter-group">
              <legend>Carburant</legend>
              <div class="chips" id="f-fuel"></div>
            </fieldset>

            <button type="button" class="btn btn-gold btn-block filters-close" id="filters-apply">Voir les résultats</button>
          </form>
        </aside>

        <div>
          <div class="results-bar">
            <p aria-live="polite"><strong id="count">12</strong> véhicule(s) disponible(s)</p>
            <div class="results-tools">
              <button type="button" class="btn btn-outline btn-sm filters-toggle" id="filters-open" aria-controls="filters">Filtres</button>
              <label class="sr-only" for="sort">Trier par</label>
              <select class="select" id="sort">
                <option value="featured">Recommandés</option>
                <option value="price-asc">Prix croissant</option>
                <option value="price-desc">Prix décroissant</option>
                <option value="km-asc">Kilométrage croissant</option>
                <option value="year-desc">Plus récents</option>
                <option value="power-desc">Plus puissants</option>
              </select>
            </div>
          </div>
          <div class="car-grid" id="results"></div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/car-svg.js"></script>
  <script src="js/main.js"></script>
  <script src="js/catalogue.js"></script>
</body>
</html>
